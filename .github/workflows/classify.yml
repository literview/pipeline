name: Classify Papers

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max papers to classify'
        required: false
        default: ''
        type: string
      embed_limit:
        description: 'Max papers to embed for the taste profile (default 5000; the backfill chunk)'
        required: false
        default: ''
        type: string

# One classify run at a time: a backfill dispatch queues behind the daily run (and vice versa)
# instead of embedding the same newest papers twice. cancel-in-progress is false because
# cancelling mid-batch is worse than queueing.
concurrency:
  group: classify
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The student step's time budget counts from here, so the job's 60 minutes cover every step.
      - name: Record job start
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-classify.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # CPU-only torch, installed FIRST so sentence-transformers reuses it.
          # The default PyPI torch wheel bundles CUDA + nvidia-* deps and made this
          # pip cache 8 GiB (280 MiB on the CPU index). Two generations of it blew the
          # 10 GB per-repo cache quota, and the LRU eviction that followed is what
          # chose the date a dead MODEL_TOKEN became visible — 2026-07-26, eight days
          # after the model repo changed owner. The runner has no GPU, so the
          # CUDA payload was never anything but ballast. See LESSONS.md L012.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-classify.txt

      # Taste profile (LiterView ledger task taste-pipeline): embed vetted core papers that have no
      # paper_embeddings row yet, newest first, at most embed_limit (5000 on the schedule). Prints a
      # notice and exits 0 while migration 060 is absent. A failure warns and never fails the job
      # (L4): the next run picks up whatever this one left, because the selection is "no row yet".
      # It runs before the classifiers: on 2026-11-23 they reached the job timeout and this step never ran.
      - name: Embed new papers (taste)
        id: embed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: pipeline
        run: python embed_new_papers.py --limit ${{ inputs.embed_limit || '5000' }}
        continue-on-error: true

      # The checkpoint lives in the private repo literview/models, which this
      # repo's default GITHUB_TOKEN cannot read. The token is minted per run by the
      # 'literview-ops' GitHub App, scoped to that one repo at Contents:read, and
      # expires in an hour. It replaces MODEL_TOKEN, a fine-grained PAT: those bind to a
      # resource OWNER and live at most a year, so when the model repo changed
      # owner on 2026-07-18 the token went blind and every run stayed
      # green anyway (LESSONS.md L012). App private keys never expire, which removes the
      # renewal ceremony rather than rescheduling it.
      - name: Mint model-repo token (GitHub App)
        id: model_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: literview
          repositories: models

      # NO CHECKPOINT CACHE — deliberate (LESSONS.md L012, 2026-08-13).
      # An actions/cache in front of this download used to skip it whenever the cache
      # hit, which hid a dead MODEL_TOKEN for 8 days after the 2026-07-18 org transfer
      # and left every run silently on weaker keyword labels. Measured price of the
      # cache: it saved 21 s/day (hit 9s vs miss 30s download + 7s save) while holding
      # 1.36 GiB of the 10 GB repo quota. The release is already durable GitHub-hosted
      # storage and costs no quota, so the cache stored the same bytes twice and bought
      # a blind spot. Running the download unconditionally makes this step the monitor
      # for the credential: if the token ever breaks again, it fails the same day.
      # Do not reintroduce a cache here.

      - name: Download student checkpoint
        env:
          # Installation token from the mint step above. Weights stay private; compute
          # stays free (this repo is public). Secrets are not exposed to fork PRs.
          GH_TOKEN: ${{ steps.model_token.outputs.token }}
        run: |
          mkdir -p pipeline/student_prod_v2
          gh release download student-v2 --repo literview/models -D pipeline/student_prod_v2 --clobber

      # The student writes and commits per chunk of 128 papers, newest first, and stops before a
      # chunk that would pass its budget B: 48 minutes from the job's start, leaving 12 of the job's
      # 60 for the fallback and the warnings. `timeout` is the backstop (TERM at B+4 minutes, KILL 30 s
      # later); a step-level timeout-minutes counts from the step's start and did not stop the
      # process on 2026-11-24. Committed chunks stay when it fires. The script prints
      # [student] remaining R and [student] oldest_hours H and emits both as step outputs.
      - name: Classify new papers (student, ModernBERT)
        id: student
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: pipeline
        run: |
          B=$(( 48 - ($(date +%s) - JOB_T0) / 60 ))
          timeout -k 30 $(( (B>0?B:0) + 4 ))m python classify_student.py --ckpt student_prod_v2 --max-minutes "$B" ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
        continue-on-error: true

      # --abstract-after-days 7: a paper with an abstract that this fallback labels is never
      # relabelled by the student, so the fallback waits 7 days for the student first. It takes
      # every untagged paper without an abstract, and a paper with one only when it is still
      # untagged 7 days after created_at (the safety net for a student that keeps failing).
      - name: Classify remaining (keyword + embedding fallback for no-abstract)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: pipeline
        run: python classify_new_papers.py --abstract-after-days 7 ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
        continue-on-error: true

      # After a bulk day a backlog is expected and clears in a few runs, so the count is an
      # annotation; the email below fires only when the backlog's oldest paper waits past 72 hours.
      - name: Report remaining backlog
        if: ${{ always() && steps.student.outputs.remaining != '' && steps.student.outputs.remaining != '0' }}
        run: |
          echo "::warning::student classifier left ${{ steps.student.outputs.remaining }} papers with an abstract unlabelled (oldest ${{ steps.student.outputs.oldest_hours }} hours); the next run continues newest first"

      - name: Warn if the unlabelled backlog is older than 72 hours (email)
        if: ${{ always() && steps.student.outputs.oldest_hours > 72 }}
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python3 pipeline/alert_email.py \
            --title "LiterView student classifier backlog older than 72 hours" \
            --body "classify.yml: the student classifier left ${{ steps.student.outputs.remaining }} papers with an abstract unlabelled, the oldest created ${{ steps.student.outputs.oldest_hours }} hours ago. Until they are labelled they are absent from subfield and discipline feeds; at 7 days the fallback labels them with keyword or embedding tags. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Warn if taste embedding failed (email)
        if: ${{ always() && steps.embed.outcome == 'failure' }}
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python3 pipeline/alert_email.py \
            --title "LiterView taste embedding step FAILED" \
            --body "classify.yml: embed_new_papers.py failed, so today's new papers have no taste vector yet; the next run retries them. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # The student step is continue-on-error so the keyword fallback still runs
      # if it dies — but a silent student failure means that day's papers get the
      # weaker keyword labels. Surface it (warning, not a hard page).
      - name: Warn if student classifier failed (email)
        if: ${{ always() && steps.student.outcome == 'failure' }}
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python3 pipeline/alert_email.py \
            --title "LiterView student classifier FELL BACK to keyword" \
            --body "classify.yml: the student step failed and the keyword/embedding fallback ran instead, so today's labels are the weaker kind. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # A separate job, because a step inside `classify` cannot see that job hit its timeout: on a
  # cancel, failure() is false there and the run ended silently (2026-11-24). This job reads the
  # job's result instead, `failure` or `cancelled`. alert_email.py imports only the standard library,
  # so the runner's python3 runs it without setup-python.
  alert:
    needs: classify
    if: ${{ always() && needs.classify.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Notify on failure (email)
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python3 pipeline/alert_email.py \
            --title "[URGENT] LiterView classify run ${{ needs.classify.result }}" \
            --body "classify.yml: the classify job ended ${{ needs.classify.result }} (job timeout, checkpoint download, DB, or the classifier itself). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
