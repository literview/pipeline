name: Cron Monitor

# Safety net for the ingest/recovery/classify crons. The per-workflow notify
# steps catch *active* failures; this catches the two modes they can't:
#   1. Silent staleness  -> ingest "succeeded" but no papers actually landed
#      (e.g. an upstream API schema change), by checking DB freshness directly.
#   2. Total cron death   -> GitHub auto-disables scheduled workflows after 60
#      days of no repo commits; the monthly heartbeat commit keeps the clock
#      reset so the crons don't silently stop after the repo goes quiet.

on:
  schedule:
    - cron: '20 */6 * * *'   # a bit after each ingest cycle
  workflow_dispatch:

permissions:
  contents: write            # for the heartbeat commit

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install psycopg2-binary

      - name: Freshness watchdog
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python - <<'PY'
          import os, subprocess, psycopg2
          from datetime import timedelta

          # Ingest runs every 6h. Only papers the ingest wrote count
          # (origin = 'pipeline'): a paper a reader saves to their library
          # (origin = 'user-library') would otherwise reset the clock and hide
          # a dead ingest. Publishers deposit few new works on Saturday and
          # Sunday, so hours on those days (UTC) are not counted: from
          # 2026-09-01 to 2026-11-15 five of the six gaps over 14h fell on a
          # weekend (longest 20.7h), and the longest gap on the weekday clock
          # was 14.1h. Alert above 18 weekday hours.
          THRESH_H = 18

          def weekday_hours(start, end):
              total, t = 0.0, start
              while t < end:
                  nxt = min(end, (t + timedelta(days=1)).replace(hour=0, minute=0, second=0, microsecond=0))
                  if t.weekday() < 5:
                      total += (nxt - t).total_seconds() / 3600.0
                  t = nxt
              return total

          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          cur = conn.cursor()
          cur.execute("SET TIME ZONE 'UTC'")
          cur.execute("SELECT (SELECT created_at FROM papers WHERE origin = 'pipeline' "
                      "ORDER BY created_at DESC LIMIT 1), now()")
          newest, now = cur.fetchone()
          hours = weekday_hours(newest, now) if newest is not None else None
          wall = (now - newest).total_seconds() / 3600.0 if newest is not None else None
          print(f"Newest pipeline paper: {newest}; weekday hours since: {hours}; wall-clock hours since: {wall}")

          if hours is not None and hours > THRESH_H:
              msg = (f"No new ingest papers in {hours:.1f} weekday hours ({wall:.1f}h wall clock; "
                     f"threshold {THRESH_H} weekday hours, Saturday and Sunday UTC not counted) - "
                     f"ingest cron may be down or auto-disabled.")
              print("STALE:", msg)
              # One shared sender for the whole estate (pipeline/alert_email.py):
              # alerts moved off ntfy on 2026-08-19 because nothing it published
              # ever reached the owner's phone. LESSONS L015.
              subprocess.run(["python3", "pipeline/alert_email.py",
                              "--title", "[URGENT] LiterView ingest STALE",
                              "--body", msg], check=False)
          PY

      - name: Heartbeat (defeat 60-day scheduled-workflow auto-disable)
        if: always()
        run: |
          last=$(cat .heartbeat 2>/dev/null || echo "1970-01-01")
          now_s=$(date -u +%s)
          last_s=$(date -u -d "$last" +%s 2>/dev/null || echo 0)
          age_days=$(( (now_s - last_s) / 86400 ))
          if [ "$age_days" -ge 25 ]; then
            date -u +%Y-%m-%d > .heartbeat
            git config user.name "cron-monitor[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .heartbeat
            git commit -m "chore: monitor heartbeat [skip ci]" && git push || echo "heartbeat commit/push skipped"
          else
            echo "heartbeat is ${age_days}d old (<25d); no commit needed"
          fi

      - name: Notify on failure (email)
        if: failure()
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python3 pipeline/alert_email.py \
            --title "[URGENT] LiterView cron-monitor FAILED" \
            --body "monitor.yml failed (DB unreachable?). A dead monitor hides a dead pipeline. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
